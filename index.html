<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>阿秋的小仓库</title>
<meta name="description" content="阿秋的时尚小垃圾展示架">
<link rel="icon" type="image/png" id="favicon" href="img/favicon-black.png" media="(prefers-color-scheme: light)">
<link rel="icon" type="image/png" href="img/favicon-white.png" media="(prefers-color-scheme: dark)">
<link rel="apple-touch-icon" href="img/apple-touch-icon.png">
<meta property="og:title" content="阿秋的小仓库">
<meta property="og:description" content="阿秋的时尚小垃圾展示架">
<meta property="og:image" content="img/hero.webp">
<style>
:root{
  --bg:#fbf7f2; --bg2:#f4ece2; --card:#ffffff; --line:#eadfd2;
  --fg:#2b2420; --dim:#7a6c62; --faint:#a89a8f;
  --accent:#e0743a; --accent-soft:#fde6d6; --accent-fg:#b4501d;
  --green:#3f9a6b; --green-soft:#ddf2e6; --blue-soft:#e3ecfb; --blue:#3d6fb8;
  --shadow:0 1px 2px rgba(60,40,20,.05), 0 6px 20px rgba(60,40,20,.06);
  --shadow-hover:0 2px 4px rgba(60,40,20,.06), 0 14px 34px rgba(60,40,20,.12);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#16130f; --bg2:#1e1a15; --card:#221d18; --line:#352d25;
    --fg:#f1e9e1; --dim:#b3a598; --faint:#7f7266;
    --accent:#f08a50; --accent-soft:#3d2618; --accent-fg:#ffb187;
    --green:#6fd09c; --green-soft:#1c3327; --blue-soft:#1d2738; --blue:#8fb3ec;
    --shadow:0 1px 2px rgba(0,0,0,.3); --shadow-hover:0 10px 30px rgba(0,0,0,.45);
  }
}
:root[data-theme="dark"]{
  --bg:#16130f; --bg2:#1e1a15; --card:#221d18; --line:#352d25;
  --fg:#f1e9e1; --dim:#b3a598; --faint:#7f7266;
  --accent:#f08a50; --accent-soft:#3d2618; --accent-fg:#ffb187;
  --green:#6fd09c; --green-soft:#1c3327; --blue-soft:#1d2738; --blue:#8fb3ec;
  --shadow:0 1px 2px rgba(0,0,0,.3); --shadow-hover:0 10px 30px rgba(0,0,0,.45);
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{
  margin:0;background:var(--bg);color:var(--fg);
  font-family:system-ui,-apple-system,"Segoe UI","PingFang SC","Microsoft YaHei UI","Microsoft YaHei","Noto Sans SC",sans-serif;
  line-height:1.65;-webkit-font-smoothing:antialiased;
}
a{color:inherit}
.wrap{max-width:1120px;margin:0 auto;padding:0 20px}

/* ---- 顶栏 ---- */
.top{display:flex;align-items:center;justify-content:space-between;padding:22px 0}
.logo{white-space:nowrap;font-weight:800;font-size:18px;text-decoration:none;letter-spacing:.3px}
.logo span{color:var(--accent)}
.top-right{display:flex;gap:8px;align-items:center}
.icon-btn{
  display:inline-flex;align-items:center;gap:6px;height:36px;padding:0 12px;border-radius:10px;
  border:1px solid var(--line);background:var(--card);color:var(--fg);font:inherit;font-size:14px;
  cursor:pointer;text-decoration:none;
}
.icon-btn:hover{border-color:var(--accent)}
.icon-btn svg{width:17px;height:17px}

/* ---- 头部介绍 ---- */
.hero{padding:40px 0 26px;display:grid;grid-template-columns:auto 1fr;gap:28px;align-items:center}
.avatar{width:104px;height:104px;border-radius:28px;background:var(--accent-soft);display:grid;place-items:center;
  font-size:38px;font-weight:800;color:var(--accent-fg);overflow:hidden;box-shadow:var(--shadow)}
.avatar img{width:100%;height:100%;object-fit:cover}
.hero h1{margin:0;font-size:clamp(28px,5vw,42px);line-height:1.2;letter-spacing:.3px}
.hero h1 .yr{color:var(--accent)}
.hero p{margin:10px 0 0;color:var(--dim);font-size:16px;max-width:640px}

/* ---- 置顶大图 ---- */
.duo{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:20px;margin:22px auto 8px;align-items:stretch}
.duo[hidden]{display:none}
/* 没有开发中的作品：只留公告，居中，宽度和平时右栏一样 */
.duo.solo{grid-template-columns:minmax(0,1fr)}
.duo.solo #featured{display:none}
.duo.solo .news{width:calc((100% - 20px) / 2.1);justify-self:center}
/* 宽屏：两栏固定同一个高度（以 MC模组 那张为准），大图区域自动伸缩 */
@media (min-width:861px){
  .duo{height:570px}
  .featured .pic{aspect-ratio:auto;flex:1;min-height:0}
  .featured .fx{flex:none}
}
/* 小分类栏：左边主分类方框，右边小分类 */
.subbar{display:flex;flex-direction:column;gap:10px;margin:28px auto 0}
.subbar[hidden]{display:none}
.subrow{display:flex;align-items:center;flex-wrap:wrap;gap:6px;padding:10px 12px;background:var(--card);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow)}
.subrow .main{padding:5px 14px;border:2px solid var(--accent);border-radius:9px;color:var(--accent-fg);font-weight:700;font-size:15px;margin-right:8px;white-space:nowrap}
.sub{border:0;background:none;color:var(--dim);padding:6px 12px;border-radius:9px;font:inherit;font-size:14px;cursor:pointer;transition:.15s}
.sub:hover{color:var(--fg);background:var(--accent-soft)}
.sub[aria-pressed="true"]{background:var(--accent-soft);color:var(--accent-fg);font-weight:600}
.sub .n{opacity:.6;margin-left:4px;font-size:12px}
#featured{display:flex;flex-direction:column;min-width:0;position:relative}
.featured{display:flex;flex-direction:column;flex:1;border-radius:22px;overflow:hidden;
  text-decoration:none;color:#fff;box-shadow:var(--shadow);background:linear-gradient(135deg,#3a130a,#1c0905)}
.featured .pic{overflow:hidden;aspect-ratio:16/9}
.featured img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .6s ease}
.featured:hover img{transform:scale(1.03)}
.featured .fx{display:flex;flex-direction:column;justify-content:center;flex:1;padding:20px clamp(20px,2.6vw,30px) 22px}
.featured .kicker{font-size:13px;letter-spacing:2px;color:#ffb37a;font-weight:600}
.featured h2{margin:6px 0 2px;font-size:clamp(24px,3.2vw,34px);line-height:1.2}
.featured .en{color:#e9b99a;font-size:14px}
.featured p{margin:12px 0 0;font-size:15px;color:#f3ddd0}
.featured .go{margin-top:16px;font-size:14px;font-weight:600;color:#ffb37a}
.featured .pic.sq{position:relative}
.featured .pic.sq::before{content:"";position:absolute;inset:-30px;background:var(--img) center/cover;filter:blur(24px) brightness(.7)}
.featured .pic.sq img{position:relative;object-fit:contain}
.feat-wrap{position:relative}
.feat-nav{position:absolute;left:0;right:0;bottom:16px;display:flex;justify-content:center;gap:8px}
#featured.has-nav .fx{padding-bottom:42px}
.feat-nav button{width:9px;height:9px;padding:0;border-radius:99px;border:0;background:rgba(255,255,255,.35);cursor:pointer;transition:.2s}
.feat-nav button:hover{background:rgba(255,255,255,.6)}
.feat-nav button[aria-current="true"]{width:24px;background:#ffb37a}
.feat-empty{flex:1;display:grid;place-items:center;border:1px dashed var(--line);border-radius:22px;padding:42px 20px;text-align:center;color:var(--faint);font-size:15px}

/* ---- 更新公告 ---- */
.news{background:var(--card);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow);overflow:hidden;position:relative;min-height:440px}
.news-in{position:absolute;inset:0;display:flex;flex-direction:column}
.news-head{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;padding:14px 18px 12px;border-bottom:1px solid var(--line)}
.news-head h3{margin:0;font-size:19px}
.nsearch{flex:0 1 190px;min-width:120px;height:32px;border-radius:999px;border:1px solid var(--line);background:var(--bg2);
  color:var(--fg);padding:0 14px;font:inherit;font-size:13px;outline:none}
.nsearch:focus{border-color:var(--accent);background:var(--card)}
.news-list{flex:1;min-height:0;overflow-y:auto;padding:4px 18px 10px;overscroll-behavior:contain}
/* 网站维护日志弹窗 */
dialog.log{border:1px solid var(--line);border-radius:18px;background:var(--card);color:var(--fg);padding:0;
  width:min(560px,calc(100vw - 32px));max-height:min(640px,82vh);box-shadow:var(--shadow-hover)}
dialog.log[open]{display:flex;flex-direction:column;animation:bub .16s ease-out both}
dialog.log::backdrop{background:rgba(25,15,8,.45);backdrop-filter:blur(2px)}
.log-head{display:flex;align-items:center;justify-content:space-between;padding:14px 18px 12px;border-bottom:1px solid var(--line)}
.log-head h3{margin:0;font-size:18px}
.log-x{border:0;background:none;color:var(--dim);font-size:22px;line-height:1;cursor:pointer;padding:4px 8px;border-radius:8px}
.log-x:hover{background:var(--bg2);color:var(--fg)}
.log-list{overflow-y:auto;padding:4px 18px 12px}
.entry{display:grid;grid-template-columns:92px 1fr;gap:14px;padding:13px 0;border-bottom:1px dashed var(--line)}
.entry:last-child{border-bottom:0}
.entry time{font-size:13px;color:var(--faint);font-variant-numeric:tabular-nums;padding-top:2px}
.entry .who{font-weight:650;font-size:15px;text-decoration:none}
.entry a.who:hover{color:var(--accent-fg)}
.ver{display:inline-block;margin-left:6px;font-size:12px;font-weight:600;padding:0 8px;border-radius:6px;background:var(--accent-soft);color:var(--accent-fg);vertical-align:1px}
.entry ul{margin:5px 0 0;padding-left:18px;color:var(--dim);font-size:14px}
.entry li{margin:1px 0}
.news-empty{color:var(--faint);text-align:center;padding:36px 0;font-size:14px}
.navlinks{display:flex;gap:4px;margin-right:6px}
.navlinks a,.navlinks button{white-space:nowrap;font:inherit;font-size:14px;color:var(--dim);text-decoration:none;padding:6px 10px;border-radius:8px;border:0;background:none;cursor:pointer}
.navlinks a:hover,.navlinks button:hover{color:var(--fg);background:var(--bg2)}
#news,#works,#partners-sec{scroll-margin-top:16px}

/* ---- 筛选 ---- */
.bar{position:sticky;top:0;z-index:5;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);
  padding:14px 0;margin-top:14px;border-bottom:1px solid transparent}
.bar.stuck{border-bottom-color:var(--line)}
.bar .wrap{display:flex;gap:10px;flex-wrap:wrap;align-items:center;justify-content:space-between}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--card);color:var(--dim);border-radius:999px;padding:6px 15px;
  font:inherit;font-size:14px;cursor:pointer;transition:.15s}
.chip:hover{color:var(--fg);border-color:var(--accent)}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:#fff}
.chip .n{opacity:.7;margin-left:4px;font-size:12px}
.search{flex:0 1 240px;min-width:160px;height:36px;border-radius:999px;border:1px solid var(--line);background:var(--card);
  color:var(--fg);padding:0 16px;font:inherit;font-size:14px;outline:none}
.search:focus{border-color:var(--accent)}

/* ---- 作品卡片 ---- */
.section-title{display:flex;align-items:baseline;gap:10px;margin:34px 0 14px}
.section-title h3{margin:0;font-size:19px}
.section-title span{color:var(--faint);font-size:13px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(258px,1fr));gap:18px}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;overflow:hidden;display:flex;flex-direction:column;
  box-shadow:var(--shadow);transition:transform .2s ease, box-shadow .2s ease;animation:pop .35s ease both}
.card{scroll-margin-top:90px}
.card:hover{transform:translateY(-4px);box-shadow:var(--shadow-hover)}
@keyframes pop{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.cover{aspect-ratio:1;background:var(--bg2);position:relative;overflow:hidden}
.cover::before{content:"";position:absolute;inset:-20px;background:var(--img) center/cover;filter:blur(18px) brightness(.85);opacity:.9}
.cover img{position:relative;width:100%;height:100%;object-fit:contain;display:block;transition:transform .4s ease}
.card:hover .cover:not(.icon) img{transform:scale(1.04)}
.cover.icon::before,.cover.blank::before{display:none}
.cover.icon{display:grid;place-items:center;background:radial-gradient(circle at 50% 40%,var(--accent-soft),var(--bg2) 75%)}
.cover.icon img{width:52%;height:auto;aspect-ratio:1;object-fit:contain;border-radius:18px;filter:drop-shadow(0 6px 14px rgba(0,0,0,.15))}
.cover.blank{display:grid;place-items:center;font-size:72px;font-weight:800;color:var(--accent-fg);
  background:repeating-linear-gradient(45deg,var(--accent-soft) 0 14px,var(--bg2) 14px 28px)}
.badge{position:absolute;top:10px;left:10px;font-size:12px;font-weight:600;padding:3px 10px;border-radius:999px;
  background:rgba(255,255,255,.92);color:#3b2f27;backdrop-filter:blur(4px)}
.badge.dev{background:#ffcf6b;color:#4a3300}
.body{padding:14px 16px 16px;display:flex;flex-direction:column;gap:8px;flex:1}
.name{font-size:17px;font-weight:700;line-height:1.35}
.en{color:var(--faint);font-size:13px;margin-top:1px}
.desc{color:var(--dim);font-size:14px;margin:0;flex:1}
.tags{display:flex;flex-wrap:wrap;gap:5px}
.tag{font-size:12px;padding:1px 8px;border-radius:6px;background:var(--bg2);color:var(--dim)}
.tag.loader{background:var(--blue-soft);color:var(--blue);font-weight:600}
.vbtn{font:inherit;font-size:12px;padding:1px 8px;border-radius:6px;border:1px dashed var(--line);background:none;color:var(--dim);cursor:pointer}
.vbtn:hover,.vbtn[aria-expanded="true"]{border-color:var(--accent);border-style:solid;color:var(--accent-fg)}
.meta{display:grid;gap:1px;font-size:12px;color:var(--faint)}
.meta b{color:var(--dim);font-weight:600}
/* 版本小气泡 */
.bubble{position:absolute;z-index:30;max-width:min(320px,calc(100vw - 24px));background:var(--card);color:var(--fg);
  border:1px solid var(--line);border-radius:14px;padding:10px 14px 12px;box-shadow:var(--shadow-hover);font-size:13px;
  animation:bub .14s ease-out both;transform-origin:var(--ox,20px) 0}
@keyframes bub{from{opacity:0;transform:scale(.92)}to{opacity:1;transform:none}}
.bubble::before{content:"";position:absolute;top:-7px;left:var(--ax,20px);width:12px;height:12px;background:var(--card);
  border-left:1px solid var(--line);border-top:1px solid var(--line);transform:translateX(-50%) rotate(45deg)}
.bubble.up{transform-origin:var(--ox,20px) 100%}
.bubble.up::before{top:auto;bottom:-7px;transform:translateX(-50%) rotate(225deg)}
.bubble .ld{font-weight:700;color:var(--blue);margin-top:8px}
.bubble .ld:first-child{margin-top:0}
.bubble .row{display:flex;gap:8px;flex-wrap:wrap;align-items:baseline;margin-top:3px}
.bubble .row b{min-width:52px;color:var(--fg)}
.bubble .row span{color:var(--dim)}
.actions{display:flex;gap:8px;margin-top:4px;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;gap:5px;font-size:13px;font-weight:600;padding:6px 12px;border-radius:9px;
  text-decoration:none;border:1px solid var(--line);color:var(--fg);background:var(--card)}
.btn:hover{border-color:var(--accent);color:var(--accent-fg)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.primary:hover{filter:brightness(1.07);color:#fff}
.btn svg{width:15px;height:15px}
.closed{font-size:12px;color:var(--faint);align-self:center}
.empty{color:var(--faint);text-align:center;padding:40px 0}

/* ---- 伙伴 ---- */
.partners{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px}
.partner{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px}
.partner b{display:block}
.partner span{font-size:13px;color:var(--dim)}
#partnersPeople{margin-top:12px}
#partnersPeople .partner{background:var(--bg2)}
footer{color:var(--faint);font-size:13px;text-align:center;padding:50px 0 40px}
footer a{color:var(--dim)}

@media (max-width:640px){
  .hero{grid-template-columns:1fr;gap:16px;padding-top:16px}
  .avatar{width:80px;height:80px;border-radius:22px;font-size:30px}
  .search{flex:1 1 100%}
  .bar{position:static}
  .gh-text{display:none}
  .navlinks{margin-right:0}
  .navlinks .hide-m{display:none}
  .navlinks button{font-size:13px;padding:6px 6px}
  .top-right{gap:6px}
  .entry{grid-template-columns:1fr;gap:2px}
}
@media (max-width:860px){
  .duo{grid-template-columns:1fr}
  .news{min-height:0}
  .news-in{position:static}
  .news-list{max-height:380px}
  .duo.solo .news{width:100%}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <nav class="top">
    <a class="logo" href="#">Arqiu<span>-owo</span></a>
    <div class="top-right">
      <div class="navlinks"><button id="logBtn" type="button">网站维护日志</button><a class="hide-m" href="#partners-sec">鸣谢</a></div>
      <button class="icon-btn" id="themeBtn" title="切换深浅色" aria-label="切换深浅色"></button>
      <a class="icon-btn" href="https://center.mcmod.cn/188965/" target="_blank" rel="noopener" title="我的 MC百科主页" aria-label="MC百科">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5V5a2 2 0 0 1 2-2h13v16H6a2 2 0 0 0-2 2"/><path d="M8 7h7"/></svg>

      </a>

        <span class="gh-text">GitHub</span>

    </div>
  </nav>

  <header class="hero">
    <div class="avatar" id="avatar">A</div>
    <div>
      <h1>你醒啦，今年是 <span class="yr" id="yr"></span> 年。</h1>
      <p id="pBio"></p>
    </div>
  </header>
</div>

<div class="bar" id="bar">
  <div class="wrap">
    <div class="chips" id="chips"></div>
    <input class="search" id="search" type="search" placeholder="搜索作品…" aria-label="搜索作品">
  </div>
</div>

<div class="wrap duo" id="duo">
  <div id="featured"></div>

  <section class="news" id="news">
    <div class="news-in">
      <div class="news-head">
        <h3>📢 更新公告</h3>
        <input class="nsearch" id="newsSearch" type="search" placeholder="搜索更新日志…" aria-label="搜索更新日志">
      </div>
      <div class="news-list" id="newsList"></div>
    </div>
  </section>
</div>

<dialog class="log" id="logDlg" aria-labelledby="logTitle">
  <div class="log-head"><h3 id="logTitle">🛠️ 网站维护日志</h3><button class="log-x" id="logX" type="button" aria-label="关闭">×</button></div>
  <div class="log-list" id="logList"></div>
</dialog>

<div class="wrap subbar" id="subbar"></div>

<main class="wrap" id="list"></main>

<div class="wrap">
  <div class="section-title" id="partners-sec"><h3>鸣谢</h3><span>没有大家就没有这些作品</span></div>
  <div class="partners" id="partnersAI"></div>
  <div class="partners" id="partnersPeople"></div>
  <footer>
    © <span id="year"></span> Arqiu-owo · 页面托管在 <a href="https://pages.github.com/" target="_blank" rel="noopener">GitHub Pages</a>
  </footer>
</div>

<script src="updates.js"></script>
<script src="sitelog.js"></script>
<script>
(function(){
  const $ = s => document.querySelector(s);
  const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
  const GH = "https://github.com/" + PROFILE.github;
  const TYPES = [
    { key:"all", label:"全部" },
    { key:"mod", label:"MC 模组" },
    { key:"app", label:"软件" },
    { key:"plugin", label:"插件" },
    { key:"other", label:"其它" },
  ];
  const ICON_TYPES = { app:1, plugin:1 };
  const ghIcon = '<svg viewBox="0 0 16 16" fill="currentColor"><path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.013 8.013 0 0016 8c0-4.42-3.58-8-8-8z"/></svg>';
  const dlIcon = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12"/><path d="m7 10 5 5 5-5"/><path d="M5 21h14"/></svg>';

  const mcIcon = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5V5a2 2 0 0 1 2-2h13v16H6a2 2 0 0 0-2 2"/><path d="M8 7h7"/></svg>';
  /* 主题 */
  const themeBtn = $("#themeBtn");
  const sun = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4.5"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>';
  const moon = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>';
  const isDark = () => document.documentElement.dataset.theme
    ? document.documentElement.dataset.theme === "dark"
    : matchMedia("(prefers-color-scheme: dark)").matches;
  function setTheme(t){ if(t) document.documentElement.dataset.theme = t; themeBtn.innerHTML = isDark() ? sun : moon; }
  try { setTheme(localStorage.getItem("theme")); } catch(e){ setTheme(); }
  themeBtn.onclick = () => { const t = isDark() ? "light" : "dark"; setTheme(t); try{ localStorage.setItem("theme", t); }catch(e){} };

  /* 网站图标：浏览器浅色用黑龙，深色用白龙 */
  const darkMQ = matchMedia("(prefers-color-scheme: dark)");
  function setFavicon(){
    document.querySelectorAll('link[rel="icon"]').forEach(l => l.remove());
    const l = document.createElement("link"); l.rel = "icon"; l.type = "image/png";
    l.href = darkMQ.matches ? "img/favicon-white.png" : "img/favicon-black.png";
    document.head.appendChild(l);
  }
  setFavicon(); darkMQ.addEventListener?.("change", setFavicon);

  /* 头部 */
  $("#ghBtn").href = GH;
  $("#pBio").textContent = PROFILE.bio;
  $("#year").textContent = new Date().getFullYear();
  const av = new Image();
  av.onload = () => { $("#avatar").innerHTML = ""; $("#avatar").appendChild(av); };
  av.alt = ""; av.src = PROFILE.avatar || ("https://github.com/" + PROFILE.github + ".png?size=240");

  const count = t => WORKS.filter(w => w.type === t).length;
  $("#yr").textContent = new Date().getFullYear();

  /* 置顶大图：显示当前分区「正在开发」的作品（「全部」= 开发中的 MC 模组），多个就能左右切换 */
  let featIdx = 0, featTimer = null;
  function devList(){
    const t = cur === "all" ? "mod" : cur;
    return WORKS.filter(w => w.type === t && w.status === "dev").sort((a,b) => (b.featured?1:0) - (a.featured?1:0));
  }
  function renderFeatured(reset){
    const list = devList();
    if (reset) featIdx = 0;
    clearInterval(featTimer);
    $("#duo").classList.toggle("solo", !list.length);  // 没有开发中的：只显示公告，居中
    if (!list.length) { $("#featured").classList.remove("has-nav"); $("#featured").innerHTML = ""; return; }
    featIdx = (featIdx + list.length) % list.length;
    const f = list[featIdx], wide = !!f.banner, img = f.banner || f.cover;
    $("#featured").innerHTML = `
      <a class="featured" href="#w-${esc(f.id)}">
        <div class="pic${wide ? "" : " sq"}"${!wide && img ? ` style="--img:url('${esc(img)}')"` : ""}>${img ? `<img src="${esc(img)}" alt="${esc(f.name)}">` : ""}</div>
        <div class="fx">
          <div class="kicker">🔥 正在制作中</div>
          <h2>${esc(f.name)}</h2><div class="en">${esc(f.en)}</div>
          <p>${esc(f.desc)}</p>
          <div class="go">了解更多 →</div>
        </div>
      </a>` + (list.length > 1 ? `<div class="feat-nav">${list.map((w,i) =>
        `<button aria-label="${esc(w.name)}" aria-current="${i===featIdx}" data-i="${i}"></button>`).join("")}</div>` : "");
    $("#featured").classList.toggle("has-nav", list.length > 1);
    if (list.length > 1) featTimer = setInterval(() => { featIdx++; renderFeatured(); }, 7000);
  }
  $("#featured").addEventListener("click", e => { const b = e.target.closest(".feat-nav button"); if (b) { featIdx = +b.dataset.i; renderFeatured(); } });

  /* 筛选 */
  let cur = "all", q = "";
  try { const h = location.hash.slice(1); if (TYPES.some(t => t.key === h)) cur = h; } catch(e){}
  function renderChips(){
    $("#chips").innerHTML = TYPES.filter(t => t.key === "all" || count(t.key))
      .map(t => `<button class="chip" data-k="${t.key}" aria-pressed="${t.key===cur}">${t.label}<span class="n">${t.key==="all"?WORKS.length:count(t.key)}</span></button>`).join("");
  }
  $("#chips").onclick = e => { const b = e.target.closest(".chip"); if(!b) return; cur = b.dataset.k; renderChips(); renderSub(); render(); renderFeatured(true); renderNews(); };
  /* 搜索作品时，把开发中展示和公告藏起来 */
  $("#search").oninput = e => { q = e.target.value.trim().toLowerCase(); $("#duo").hidden = $("#subbar").hidden = !!q; render(); };

  /* 小分类（works.js 里的 series）：每个主分类一行，按作品数从多到少，没写 series 的归「未分类」放最后 */
  const TNAME = {mod:"MC模组", app:"软件", plugin:"插件"};
  const NONE = "#none";
  const sub = {};  // 主分类 -> "all" / 系列名 / NONE
  const subOk = w => { const s = sub[w.type] || "all"; return s === "all" || (s === NONE ? !w.series : w.series === s); };
  function renderSub(){
    const types = (cur === "all" ? Object.keys(TNAME) : [cur]).filter(t => count(t));
    $("#subbar").innerHTML = types.map(t => {
      const items = WORKS.filter(w => w.type === t), m = {}; let none = 0;
      items.forEach(w => w.series ? (m[w.series] = (m[w.series] || 0) + 1) : none++);
      const list = Object.entries(m).sort((a, b) => b[1] - a[1]);
      if (none) list.push([NONE, none]);
      const s = sub[t] || "all";
      const btn = (k, label, n) => `<button class="sub" type="button" data-t="${t}" data-s="${esc(k)}" aria-pressed="${s === k}">${esc(label)}<span class="n">${n}</span></button>`;
      return `<div class="subrow"><span class="main">${TNAME[t] || "其它"}</span>${btn("all", "全部", items.length)}${list.map(([k, n]) => btn(k, k === NONE ? "未分类" : k, n)).join("")}</div>`;
    }).join("");
  }
  $("#subbar").onclick = e => { const b = e.target.closest(".sub"); if (!b) return; sub[b.dataset.t] = b.dataset.s; renderSub(); render(); };

  /* 卡片 */
  /* 最新版本 / 最后更新：自动取 updates.js 里每个作品最新的一条 */
  const latest = {};
  (typeof UPDATES !== "undefined" ? UPDATES : []).forEach((u, i) => {
    if (!u.work) return;
    const l = latest[u.work] || (latest[u.work] = { idx: i });  // idx：在 updates.js 里第一次出现的位置（越小越新）
    if (!l.date || u.date > l.date) l.date = u.date;
    if (u.version && (!l.version || cmpVer(u.version, l.version) > 0)) l.version = u.version;
  });
  function cmpVer(a, b){
    const x = a.split(/[.\-]/).map(Number), y = b.split(/[.\-]/).map(Number);
    for (let i = 0; i < Math.max(x.length, y.length); i++) { const d = (x[i]||0) - (y[i]||0); if (d) return d; }
    return 0;
  }
  const LOADER_ORDER = ["Fabric","NeoForge","Forge","Quilt"];
  const loadersOf = w => Object.keys(w.versions || {}).sort((a,b) => (LOADER_ORDER.indexOf(a)+99)%99 - (LOADER_ORDER.indexOf(b)+99)%99);
  // 1.x 的按 1.21.x 这样分；26 起（年份版本号）整个大版本折一起：26.x、27.x
  const major = v => { const p = v.split("."); return (+p[0] >= 26 ? p[0] : p.slice(0,2).join(".")) + ".x"; };
  function versionGroups(list){
    const g = {};
    [...list].sort(cmpVer).forEach(v => (g[major(v)] = g[major(v)] || []).push(v));
    return Object.entries(g);
  }
  function card(w){
    const coverCls = !w.cover ? "blank" : (ICON_TYPES[w.type] ? "icon" : "");
    const coverHtml = w.cover ? `<img src="${esc(w.cover)}" alt="${esc(w.name)}" loading="lazy">` : esc([...w.name][0]);
    const badge = w.status === "dev" ? '<span class="badge dev">开发中</span>' : "";
    const loaders = loadersOf(w);
    const nVer = new Set(Object.values(w.versions || {}).flat()).size;
    const tags = [...loaders, ...(w.platform || [])].map(t => `<span class="tag loader">${esc(t)}</span>`).join("")
      + (nVer ? `<button class="vbtn" data-id="${esc(w.id)}" aria-expanded="false">${nVer} 个版本 ▾</button>` : "");
    const l = latest[w.id] || {};
    const meta = (l.version ? `<span>最新版本 <b>${esc(l.version)}</b></span>` : "")
      + (l.date ? `<span>最后更新 ${esc(l.date)}</span>` : "");
    let actions = "";
    if (w.repo) {
      const url = GH + "/" + w.repo;
      actions += `<a class="btn primary" href="${url}/releases/latest" target="_blank" rel="noopener">${dlIcon}下载</a>`;
      actions += `<a class="btn" href="${url}" target="_blank" rel="noopener">${ghIcon}源码</a>`;
    }
    if (w.mcmod) actions += `<a class="btn${w.repo ? "" : " primary"}" href="https://www.mcmod.cn/class/${encodeURIComponent(w.mcmod)}.html" target="_blank" rel="noopener">${mcIcon}MC百科</a>`;
    (w.links||[]).forEach(l => actions += `<a class="btn" href="${esc(l.url)}" target="_blank" rel="noopener">${esc(l.text)}</a>`);
    if (!actions) actions = `<span class="closed">${w.status==="dev" ? "还在做，敬请期待~" : "暂未开源"}</span>`;
    return `
      <article class="card" id="w-${esc(w.id)}">
        <div class="cover ${coverCls}"${w.cover && !ICON_TYPES[w.type] ? ` style="--img:url('${esc(w.cover)}')"` : ""}>${coverHtml}${badge}</div>
        <div class="body">
          <div><div class="name">${esc(w.name)}</div>${w.en?`<div class="en">${esc(w.en)}</div>`:""}</div>
          <p class="desc">${esc(w.desc)}</p>
          <div class="tags">${tags}</div>
          ${meta ? `<div class="meta">${meta}</div>` : ""}
          <div class="actions">${actions}</div>
        </div>
      </article>`;
  }
  function render(){
    closeBubble();
    const list = WORKS.filter(w => (cur === "all" || w.type === cur) &&
      (q ? true : subOk(w)) && (!q || [w.name,w.en,w.desc,w.series,...loadersOf(w),...Object.values(w.versions||{}).flat(),...(w.platform||[])].join(" ").toLowerCase().includes(q)));
    if (!list.length) { $("#list").innerHTML = '<p class="empty">没有找到符合的作品 (・_・?)</p>'; return; }
    // 最近更新的排前面（日期新的在前；同一天按 updates.js 里的先后）；没有更新记录的放最后
    list.sort((a, b) => {
      const x = latest[a.id], y = latest[b.id];
      if (!x || !y) return (x ? 0 : 1) - (y ? 0 : 1);
      return x.date !== y.date ? (x.date < y.date ? 1 : -1) : x.idx - y.idx;
    });
    // 按小分类（series）分组，标题只写小分类名；系列的先后 = 系列里最近更新的那个作品
    const groups = [];
    list.forEach(w => {
      const key = w.type + "|" + (w.series || NONE);
      let grp = groups.find(x => x.key === key); if (!grp) groups.push(grp = { key, name: w.series || "未分类", items:[] });
      grp.items.push(w);
    });
    $("#list").innerHTML = groups.map(g => `
      <div class="section-title"><h3>${esc(g.name)}</h3><span>${g.items.length} 个</span></div>
      <div class="grid">${g.items.map(card).join("")}</div>`).join("");
  }
  renderChips(); renderSub(); render(); renderFeatured(true);

  /* 更新公告：跟着顶上的分区按钮走，自带搜索框 */
  const byId = Object.fromEntries(WORKS.map(w => [w.id, w]));
  const UPD = (typeof UPDATES !== "undefined" ? UPDATES : []).map(u => {
    const w = byId[u.work];
    return { ...u, w, type: u.type || (w && w.type) || "other",
      text: [u.date, u.version, u.title, w && w.name, w && w.en, ...(u.items || [])].join(" ").toLowerCase() };
  });
  const entryHtml = (date, who, ver, items) => `<div class="entry"><time>${esc(date)}</time><div>${who}${ver ? `<span class="ver">${esc(ver)}</span>` : ""}${
    items && items.length ? `<ul>${items.map(i => `<li>${esc(i)}</li>`).join("")}</ul>` : ""}</div></div>`;
  let newsQ = "";
  function renderNews(){
    const list = UPD.filter(u => (cur === "all" || u.type === cur) && (!newsQ || u.text.includes(newsQ)));
    $("#newsList").scrollTop = 0;
    $("#newsList").innerHTML = list.length ? list.map(u => entryHtml(u.date,
      u.w ? `<a class="who" href="#w-${esc(u.w.id)}">${esc(u.w.name)}</a>` : `<span class="who">${esc(u.title || "")}</span>`,
      u.version, u.items)).join("")
      : `<p class="news-empty">${newsQ ? "没有搜到相关的更新日志 (・_・?)" : "这里暂时还空着，以后会有东西的~ (｡•̀ᴗ-)✧"}</p>`;
  }
  $("#newsSearch").oninput = e => { newsQ = e.target.value.trim().toLowerCase(); renderNews(); };
  renderNews();

  /* 网站维护日志弹窗 */
  const dlg = $("#logDlg");
  $("#logList").innerHTML = (typeof SITE_LOG !== "undefined" ? SITE_LOG : []).map(s => {
    const d = String(s.version).match(/^(\d{4})(\d{2})(\d{2})/);
    return entryHtml(d ? `${d[1]}-${d[2]}-${d[3]}` : "", `<span class="who">${esc(s.version)}</span>`, "", s.items);
  }).join("") || '<p class="news-empty">还没有维护记录~</p>';
  $("#logBtn").onclick = () => { closeBubble(); dlg.showModal(); $("#logList").scrollTop = 0; };
  $("#logX").onclick = () => dlg.close();
  dlg.addEventListener("click", e => { if (e.target === dlg) dlg.close(); });  // 点弹窗外面也能关
  /* 点公告里的作品名：如果卡片被筛选藏起来了，先切回全部 */
  document.addEventListener("click", e => {
    const a = e.target.closest('a[href^="#w-"]'); if (!a) return;
    const id = a.getAttribute("href");
    if (!document.querySelector(id)) { e.preventDefault(); cur = "all"; q = ""; $("#search").value = ""; $("#duo").hidden = $("#subbar").hidden = false; for (const k in sub) delete sub[k]; renderChips(); renderSub(); render(); renderFeatured(true); renderNews(); document.querySelector(id)?.scrollIntoView(); }
  });

  /* 伙伴 */
  const pc = p => `<div class="partner"><b>${esc(p.name)}</b><span>${esc(p.role)}</span></div>`;
  $("#partnersAI").innerHTML = (PROFILE.thanksAI || []).map(pc).join("");
  $("#partnersPeople").innerHTML = (PROFILE.thanksPeople || []).map(pc).join("");

  /* 吸顶阴影 */
  const bar = $("#bar");
  new IntersectionObserver(([e]) => bar.classList.toggle("stuck", e.intersectionRatio < 1), { threshold:[1], rootMargin:"-1px 0px 0px 0px" }).observe(bar);

  /* 版本小气泡 */
  var bub = null, bubBtn = null;
  function closeBubble(){ if (bub) { bub.remove(); bub = null; } if (bubBtn) { bubBtn.setAttribute("aria-expanded","false"); bubBtn = null; } }
  function openBubble(btn){
    const w = byId[btn.dataset.id]; if (!w) return;
    closeBubble();
    bub = document.createElement("div"); bub.className = "bubble"; bub.setAttribute("role","dialog");
    bub.innerHTML = loadersOf(w).map(ld => `<div class="ld">${esc(ld)}</div>` +
      versionGroups(w.versions[ld]).map(([m, vs]) => `<div class="row"><b>${esc(m)}</b><span>${vs.map(esc).join("&nbsp;&nbsp;")}</span></div>`).join("")).join("");
    document.body.appendChild(bub);
    const r = btn.getBoundingClientRect(), bw = bub.offsetWidth, bh = bub.offsetHeight;
    let left = r.left + scrollX + r.width/2 - 26;
    left = Math.max(scrollX + 12, Math.min(left, scrollX + document.documentElement.clientWidth - bw - 12));
    const below = r.bottom + 10 + bh < innerHeight || r.top < bh + 20;
    bub.classList.toggle("up", !below);
    bub.style.top = (below ? r.bottom + scrollY + 10 : r.top + scrollY - bh - 10) + "px";
    bub.style.left = left + "px";
    const ax = Math.max(16, Math.min(bw - 16, r.left + scrollX + r.width/2 - left));
    bub.style.setProperty("--ax", ax + "px"); bub.style.setProperty("--ox", ax + "px");
    btn.setAttribute("aria-expanded","true"); bubBtn = btn;
  }
  document.addEventListener("click", e => {
    const btn = e.target.closest(".vbtn");
    if (btn) { if (btn === bubBtn) closeBubble(); else openBubble(btn); return; }
    if (!e.target.closest(".bubble")) closeBubble();
  });
  document.addEventListener("keydown", e => { if (e.key === "Escape") closeBubble(); });
  addEventListener("resize", closeBubble);
})();
</script>
</body>
</html>
